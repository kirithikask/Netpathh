# Demo profile: runs the whole application with no external services.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Schema comes from Hibernate instead of Flyway because the Flyway migrations target PostgreSQL.
# Redis is not required: if it is absent, path health is rebuilt from the database on every read
# and a single warning is logged. Use the default profile with docker-compose for the real setup.
spring:
  datasource:
    url: jdbc:h2:file:./data/netpath;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

app:
  demo-data:
    enabled: true

logging:
  level:
    com.netpath: INFO
