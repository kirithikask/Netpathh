# Demo profile: runs the whole application with no external services.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Schema comes from Hibernate instead of Flyway because the Flyway migrations target PostgreSQL
# (they use plpgsql trigger functions). Redis is not required: if it is absent, path health is
# rebuilt from the database on every read and a single warning is logged.
#
# This profile is for looking at the console with nothing installed. The realistic setup - real
# PostgreSQL, Flyway migrations, ddl-auto=validate - is the default profile; see README.md.
spring:
  datasource:
    url: jdbc:h2:file:./data/netpath;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

app:
  # The one place demo data is switched on by default.
  demo-data:
    enabled: true
  security:
    jwt:
      # Development-only signing key. Production sets JWT_SECRET; the default profile has no fallback.
      secret: netpath-dev-profile-insecure-signing-key-local-only

logging:
  level:
    com.netpath: INFO
