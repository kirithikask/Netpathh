server:
  # SERVER_PORT wins when set, then the PORT that container hosts such as Render inject, then 8080.
  # An explicit first link matters: an unrelated PORT in the environment would otherwise silently
  # move the bind port out from under the frontend's proxy.
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: netpath

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:netpath}
    username: ${DB_USERNAME:netpath}
    password: ${DB_PASSWORD:netpath}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # PostgreSQL is the source of truth and Flyway owns its schema. Hibernate only checks that the
      # entities match what the migrations built, so drift fails at startup instead of silently
      # reshaping a production database.
      ddl-auto: validate
    show-sql: false
    # Open Session in View keeps a database session open while the response is rendered, which hides
    # lazy-loading mistakes behind N+1 queries instead of surfacing them. Every read the API serves
    # is assembled inside its own transaction, so the session is not needed past it.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    # Nulls are serialized deliberately: the console's TypeScript types describe every field, and
    # omitted keys would force every consumer to treat "absent" and "null" as different states.
    serialization:
      write-dates-as-timestamps: false

app:
  demo-data:
    # Off unless explicitly switched on: a production database must start empty and receive its data
    # through the API. The dev profile opts in; nothing else does.
    enabled: ${DEMO_DATA_ENABLED:false}
    email: ${DEMO_DATA_EMAIL:operator@netpath.io}
    password: ${DEMO_DATA_PASSWORD:netpath123}
  bootstrap-admin:
    # Creates the first operator on a database with no users. Off by default; the demo estate above is
    # not a substitute, because it fabricates paths and telemetry that must never reach production.
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:NETPATH Operator}
  security:
    jwt:
      # Intentionally has no default. JwtUtils refuses to start without it, so an unset secret fails
      # loudly at boot rather than shipping a known signing key.
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors:
      # Comma-separated origins. Production sets this to the deployed frontend origin.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  path-health:
    # Window that current health is computed over. Telemetry is retained indefinitely for history;
    # this only bounds the aggregation used to classify a path right now.
    window-minutes: 60
    thresholds:
      # DEGRADED at or above the "degraded" boundary, DOWN at or above the "down" boundary.
      degraded-latency-ms: 100
      down-latency-ms: 500
      degraded-packet-loss-pct: 0.5
      down-packet-loss-pct: 10.0
      min-metrics-for-evaluation: 3
    cache:
      ttl-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.netpath: INFO
